<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>后台管理 - 用户明细与设备控制</title>
    <style>
        * { box-sizing: border-box; }
        
        /* 🌟 优化：使用 Flex 布局控制全屏高度，防止悬浮遮挡内容 */
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { 
            background-color: #0f172a; 
            color: #e2e8f0; 
            font-family: monospace; 
            display: flex;
            flex-direction: column;
            padding: 15px;
            height: 100vh;
            height: 100dvh; /* 适配移动端浏览器地址栏 */
        }
        
        .auth-box { text-align: center; margin-top: 60px; }
        input.pwd-input { padding: 12px; border-radius: 8px; border: 1px solid #38bdf8; background: #1e293b; color: white; outline: none; width: 100%; max-width: 300px; font-size: 16px; margin-bottom: 15px; }
        button.btn-primary { padding: 12px 20px; border-radius: 8px; border: none; background: #0ea5e9; color: white; cursor: pointer; font-weight: bold; width: 100%; max-width: 300px; font-size: 16px; }
        
        /* 🌟 优化：控制面板不允许被压缩，始终位于顶部 */
        .control-panel { 
            display: none; 
            flex-wrap: wrap; 
            justify-content: space-between; 
            align-items: center; 
            flex-shrink: 0; /* 保证高度不被压缩 */
            background: #1e293b; 
            padding: 15px; 
            border-radius: 10px; 
            border: 1px solid #334155; 
            gap: 15px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); /* 增加悬浮阴影感 */
        }
        
        .panel-left { font-size: 16px; font-weight: bold; color: #38bdf8; display: flex; align-items: center; justify-content: space-between; flex: 1; min-width: 100%; }
        .search-container { display: flex; gap: 10px; flex: 1; min-width: 100%; }
        .search-box { padding: 10px 15px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; font-size: 14px; }
        .filter-select { flex: 1; min-width: 110px; }
        .input-text { flex: 2; min-width: 150px; }
        .btn-export { background: #10b981; padding: 10px 15px; border-radius: 8px; border: none; color: white; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; white-space: nowrap; }
        .btn-export:hover { background: #059669; }
        .btn-export:active { background: #047857; }
        
        /* 🌟 优化：表格外壳占据剩余全部高度，并在内部滚动 */
        .table-wrapper { 
            display: none; 
            width: 100%; 
            flex: 1; /* 占据剩余屏幕空间 */
            overflow: auto; /* 内部滚动 (X轴和Y轴) */
            margin-top: 15px; 
            background: #1e293b; 
            border-radius: 10px; 
            border: 1px solid #334155; 
        }
        
        table { width: 100%; border-collapse: collapse; min-width: 1800px; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #334155; border-right: 1px solid #334155; text-align: left; white-space: nowrap; vertical-align: middle; }
        th:last-child, td:last-child { border-right: none; }
        
		/* 🌟 优化：表头吸顶及样式区分 */
		th { 
			background: #162032; 
			color: #38bdf8; 
			position: sticky; 
			top: 0; 
			z-index: 10; 
			border-bottom: 1px solid #334155; /* 改为与内容单元格完全一致的细边框 */
			box-shadow: 0 4px 6px -2px rgba(0, 0, 0, 0.4); /* 保留极其微弱的阴影，让滑动时依然有层级感 */
		}
        
        .sortable-th { cursor: pointer; user-select: none; transition: color 0.2s; }
        .sortable-th:hover { color: #e2e8f0; }
        
        .vip-purchased { color: #f59e0b; font-weight: bold; } 
        .vip-gifted { color: #8b5cf6; font-weight: bold; }    
        .vip-no { color: #94a3b8; }                           
        .vip-unreg { color: #64748b; font-style: italic; } 
        .action-group { display: flex; gap: 8px; }
        .btn-unbind { background: #0ea5e9; padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; border: none; color: white; cursor: pointer; }
        .btn-unbind:active { background: #0284c7; }
        .btn-delete { background: #ef4444; padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; border: none; color: white; cursor: pointer; }
        .btn-delete:active { background: #b91c1c; }
        .btn-disabled { background: #475569; padding: 8px 12px; font-size: 13px; border-radius: 6px; border: none; color: #94a3b8; cursor: not-allowed; }
        .uuid-text { font-size: 12px; color: #94a3b8; font-family: monospace; }
        .version-text { font-weight: bold; color: #38bdf8; }
        .model-text { font-weight: bold; color: #f97316; } 

        .remark-cell { cursor: pointer; min-width: 160px; transition: background 0.2s; border-radius: 4px; }
        .remark-cell:hover { background: #334155; }
        .remark-input { width: 100%; padding: 6px 8px; border-radius: 4px; border: 1px solid #38bdf8; background: #0f172a; color: white; font-family: monospace; outline: none; }

        /* 🌟 移动端极度优化：防止顶部控件占用太多高度 */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .control-panel { gap: 10px; padding: 10px; }
            .search-container { flex-wrap: wrap; gap: 8px; }
            .filter-select { flex: 1; min-width: 45%; }
            .input-text { flex: 2; min-width: 100%; order: -1; } /* 让搜索框占满整行并在最上方 */
            .btn-export { flex: 1; min-width: 45%; }
            .table-wrapper { margin-top: 10px; }
        }
    </style>
</head>
<body>

    <div class="auth-box" id="authBox">
        <h2>🔒 高级管理员后台</h2>
        <input type="password" id="adminPwd" class="pwd-input" placeholder="请输入管理员密码">
        <br>
        <button class="btn-primary" onclick="fetchData()">解锁数据</button>
        <p id="errMsg" style="color: #ef4444; display: none; margin-top: 15px; font-weight: bold;"></p>
    </div>

    <div class="control-panel" id="controlPanel">
        <div class="panel-left">
            <span>👥 用户总库</span>
            <span id="userCount" style="color: #94a3b8; font-size: 14px;">共 0 人</span>
        </div>
        <div class="search-container">
            <select id="vipFilter" class="search-box filter-select" onchange="filterTable()">
                <option value="全部">全部状态</option>
                <option value="购买永久VIP">🟠 仅看购买VIP</option>
                <option value="赠送永久VIP">🎁 仅看赠送VIP</option>
                <option value="普通用户">⚪ 仅看普通用户</option>
                <option value="未注册用户">👻 仅看未注册用户</option>
                <option value="排除未注册用户">🚫 排除未注册用户</option>
            </select>
            <input type="text" id="searchInput" class="search-box input-text" placeholder="🔍 搜用户名/UUID/备注/密钥..." oninput="filterTable()">
            <button class="btn-export" onclick="exportToCSV()">📥 导出.csv</button>
        </div>
    </div>

    <div class="table-wrapper" id="tableWrapper">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>用户名</th>
                    <th>密码</th>
                    <th>身份状态</th>
                    <th>售价</th>
                    <th>使用的密钥</th>
                    <th title="同步自发货控制台的卡密备注，仅供查看">密钥备注 🏷️</th>
                    <th>注册 / 核销时间</th>
                    <th id="thFirstActive" class="sortable-th" onclick="toggleFirstActiveSort()" title="点击切换：默认 / 远到近 / 近到远">首次安装 ↕️</th>
                    <th title="最右侧为今天，绿色代表上线">7日活跃轨迹 💡</th>
                    <th>App版本</th>
                    <th>车机型号/系统</th>
                    <th id="thLastActive" class="sortable-th" onclick="toggleLastActiveSort()" title="点击切换：默认 / 远到近 / 近到远">最后活跃时间 ↕️</th>
                    <th title="防破解蜜罐探针检测结果">查水表 🕵️</th>
                    <th>操作控制</th>
                    <th>当前绑定设备 (UUID)</th>
					<th style="width: 80px;">换绑标记</th>
                    <th title="点击单元格可直接编辑内容，按下回车键保存">用户专属备注 ✏️</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://clefvejumahurbbzdwbe.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsZWZ2ZWp1bWFodXJiYnpkd2JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMzE0MzIsImV4cCI6MjA4ODYwNzQzMn0.KB_WSUNRfmZ7Kvps8Gpvr1EESmX25d3t7TeZrP4kdEo';
        
        let currentPwd = '';
        let allUserData = []; 
		let supersededCounts = {}; // 🌟 新增：用来存换绑次数的对象
        let currentFilteredData = []; 
        let lastActiveSortOrder = 0; 
        let firstActiveSortOrder = 0;

        function formatTime(isoString) {
            if (!isoString) return '';
            const d = new Date(isoString);
            if (isNaN(d.getTime())) return '';
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const hh = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
        }

        function generateTrafficLights(recentDatesStrArray) {
            const dates = recentDatesStrArray || [];
            let html = '<div style="display:flex; gap:6px; align-items:center;">';
            const today = new Date();
            for (let i = 6; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const dateStr = `${yyyy}-${mm}-${dd}`;
                const isActive = dates.includes(dateStr);
                const color = isActive ? '#10b981' : '#334155'; 
                const shadow = isActive ? 'box-shadow: 0 0 6px #10b981;' : '';
                const title = isActive ? `${dateStr} (已打卡)` : `${dateStr} (未上线)`;
                html += `<div title="${title}" style="width:12px; height:12px; border-radius:50%; background-color:${color}; ${shadow} cursor:help;"></div>`;
            }
            html += '</div>';
            return html;
        }

		async function fetchData() {
            currentPwd = document.getElementById('adminPwd').value.trim();
            const btn = document.querySelector('.btn-primary');
            btn.innerText = "加载中...";
            btn.disabled = true;

            const headers = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' };

            try {
                // 🌟 升级：同时向云端发起两个请求（1.验证密码拿全量数据；2.获取换绑旧ID黑名单）
				// 🌟 升级：两个请求全部走安全的 POST RPC 通道
                const [userRes, supersededRes] = await Promise.all([
                    fetch(`${SUPABASE_URL}/rest/v1/rpc/get_all_user_details`, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({ admin_pwd: currentPwd })
                    }),
                    // 🌟 新增：调用刚刚部署的次数统计函数
                    fetch(`${SUPABASE_URL}/rest/v1/rpc/get_superseded_counts`, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({ admin_pwd: currentPwd })
                    })
                ]);

                const resData = await userRes.json();
                
                // 🌟 获取换绑次数并存入全局变量
                if (supersededRes.ok) {
                    const supersededResData = await supersededRes.json();
                    if (supersededResData.success) {
                        supersededCounts = supersededResData.data; // 得到形如 {"test1": 1, "test2": 2}
                    }
                }

                btn.innerText = "解锁数据";
                btn.disabled = false;

                if (resData.success) {
                    // 原有的 UI 面板切换逻辑保持不变
                    document.getElementById('errMsg').style.display = 'none';
                    document.getElementById('authBox').style.display = 'none';
                    document.getElementById('controlPanel').style.display = 'flex';
                    document.getElementById('tableWrapper').style.display = 'block'; 
                    
                    lastActiveSortOrder = 0;
                    firstActiveSortOrder = 0;
                    document.getElementById('thLastActive').innerHTML = '最后活跃时间 ↕️';
                    document.getElementById('thFirstActive').innerHTML = '首次安装 ↕️';
                    
                    // 原有的时间降序排序逻辑保持不变
                    allUserData = resData.data.sort((a, b) => {
                        const timeA = a.created_at ? new Date(a.created_at).getTime() : 0;
                        const timeB = b.created_at ? new Date(b.created_at).getTime() : 0;
                        return timeB - timeA;
                    });
                    
                    filterTable(); 
                } else {
                    const errorStr = resData.msg || resData.message || "未知数据库错误：" + JSON.stringify(resData);
                    document.getElementById('errMsg').innerText = errorStr;
                    document.getElementById('errMsg').style.display = 'block';
                }
            } catch (err) {
                btn.innerText = "解锁数据";
                btn.disabled = false;
                document.getElementById('errMsg').innerText = "请求失败，请检查网络：" + err;
                document.getElementById('errMsg').style.display = 'block';
            }
        }

        function toggleLastActiveSort() {
            lastActiveSortOrder = (lastActiveSortOrder + 1) % 3;
            firstActiveSortOrder = 0; 
            
            document.getElementById('thFirstActive').innerHTML = '首次安装 ↕️';
            const th = document.getElementById('thLastActive');
            
            if (lastActiveSortOrder === 0) {
                th.innerHTML = '最后活跃时间 ↕️';
                allUserData.sort((a, b) => {
                    const timeA = a.created_at ? new Date(a.created_at).getTime() : 0;
                    const timeB = b.created_at ? new Date(b.created_at).getTime() : 0;
                    return timeB - timeA;
                });
            } 
            else if (lastActiveSortOrder === 1) {
                th.innerHTML = '最后活跃时间 ⬆️ (远到近)';
                allUserData.sort((a, b) => {
                    if (!a.last_active && !b.last_active) return 0;
                    if (!a.last_active) return 1; 
                    if (!b.last_active) return -1;
                    return new Date(a.last_active) - new Date(b.last_active);
                });
            } 
            else if (lastActiveSortOrder === 2) {
                th.innerHTML = '最后活跃时间 ⬇️ (近到远)';
                allUserData.sort((a, b) => {
                    if (!a.last_active && !b.last_active) return 0;
                    if (!a.last_active) return 1; 
                    if (!b.last_active) return -1;
                    return new Date(b.last_active) - new Date(a.last_active);
                });
            }
            filterTable();
        }

        function toggleFirstActiveSort() {
            firstActiveSortOrder = (firstActiveSortOrder + 1) % 3;
            lastActiveSortOrder = 0; 
            
            document.getElementById('thLastActive').innerHTML = '最后活跃时间 ↕️';
            const th = document.getElementById('thFirstActive');
            
            if (firstActiveSortOrder === 0) {
                th.innerHTML = '首次安装 ↕️';
                allUserData.sort((a, b) => {
                    const timeA = a.created_at ? new Date(a.created_at).getTime() : 0;
                    const timeB = b.created_at ? new Date(b.created_at).getTime() : 0;
                    return timeB - timeA;
                });
            } 
            else if (firstActiveSortOrder === 1) {
                th.innerHTML = '首次安装 ⬆️ (远到近)';
                allUserData.sort((a, b) => {
                    if (!a.first_active && !b.first_active) return 0;
                    if (!a.first_active) return 1; 
                    if (!b.first_active) return -1;
                    return new Date(a.first_active) - new Date(b.first_active);
                });
            } 
            else if (firstActiveSortOrder === 2) {
                th.innerHTML = '首次安装 ⬇️ (近到远)';
                allUserData.sort((a, b) => {
                    if (!a.first_active && !b.first_active) return 0;
                    if (!a.first_active) return 1; 
                    if (!b.first_active) return -1;
                    return new Date(b.first_active) - new Date(a.first_active);
                });
            }
            filterTable();
        }

        function getUserVipType(user) {
            if (!user.username) return "未注册用户";
            if (!user.is_vip) return "普通用户";
            if (user.sell_status === '已赠送') return "赠送永久VIP";
            return "购买永久VIP"; 
        }

		function renderTable(dataArray) {
            const tbody = document.getElementById('tableBody');
            let htmlString = ''; 
            
            dataArray.forEach(user => {
                const isUnreg = !user.username;
                const displayUsername = isUnreg ? `<span style="color:#64748b; font-style:italic;">(未注册设备)</span>` : user.username;
                const displayPassword = isUnreg ? `<span style="color:#64748b;">-</span>` : user.password;
                
                const isBound = user.device_uuid && user.device_uuid !== '';
                const uuidDisplay = isBound ? user.device_uuid : `<span style="color:#ef4444;">未绑定设备</span>`;

                // 🌟 新增核心逻辑：判断当前用户的 UUID 是否在换绑黑名单 Set 中
				// 🌟 终极逻辑：从全局对象中获取该用户的换绑次数，没有就是 0
                const rebindCount = user.username ? (supersededCounts[user.username] || 0) : 0;
                
                // 🌟 如果大于 0，就显示一个橙色的标签框，否则留空
                const markHtml = rebindCount > 0 
                    ? `<span style="color: #f59e0b; font-weight: bold; border: 1px solid #f59e0b; padding: 2px 6px; border-radius: 4px; font-size: 12px; background: rgba(245, 158, 11, 0.1);" title="该账号曾换绑过 ${rebindCount} 次设备">🔄 ${rebindCount} 次</span>` 
                    : '';

                const safeUsername = user.username ? user.username : '';
                const safeUuid = user.device_uuid ? user.device_uuid : '';
                const deleteHtml = `<button class="btn-delete" onclick="deleteUser('${safeUsername}', '${safeUuid}')">删除</button>`;

                let actionBtn = '';

                if (isUnreg) {
                    actionBtn = `<div class="action-group">${deleteHtml}</div>`;
                } else {
                    const unbindHtml = isBound 
                        ? `<button class="btn-unbind" onclick="forceUnbind('${user.username}')">解绑</button>`
                        : `<button class="btn-disabled" disabled>解绑</button>`;
                    actionBtn = `<div class="action-group">${unbindHtml}${deleteHtml}</div>`;
                }

                const vipType = getUserVipType(user);
                let vipClass = "vip-no";
                if (vipType === "购买永久VIP") vipClass = "vip-purchased";
                else if (vipType === "赠送永久VIP") vipClass = "vip-gifted";
                else if (vipType === "未注册用户") vipClass = "vip-unreg";

                const priceDisplay = (user.price !== null && user.price !== undefined) 
                    ? `<span style="color:#f59e0b; font-weight:bold;">¥ ${user.price}</span>` 
                    : `<span style="color:#64748b;">-</span>`;

                const regTime = user.created_at ? `<div style="font-size:12px;color:#94a3b8;margin-bottom:4px;" title="注册时间">📝 ${formatTime(user.created_at)}</div>` : '';
                const actTime = user.used_time ? `<div style="font-size:12px;color:#f59e0b;" title="核销时间">🔑 ${formatTime(user.used_time)}</div>` : '';
                const timeBox = (regTime || actTime) ? `${regTime}${actTime}` : `<span style="color: #64748b;">-</span>`;

                const firstActive = user.first_active ? `<span style="color: #38bdf8; font-weight:bold;">${user.first_active}</span>` : `<span style="color: #64748b;">-</span>`;
                const trafficLights = generateTrafficLights(user.recent_7_days);

                const appVersion = user.app_version ? `<span class="version-text">${user.app_version}</span>` : `<span style="color: #64748b;">-</span>`;
                const deviceModel = user.device_model ? `<span class="model-text">${user.device_model}</span>` : `<span style="color: #64748b;">-</span>`;

                const activeDisplay = user.last_active 
                    ? `<span style="color: #10b981; font-weight: bold;">${user.last_active}</span>` 
                    : `<span style="color: #64748b;">无记录</span>`;

                let crackDisplay = `<span style="color: #64748b;">正常</span>`; 
                if (user.is_cracked) {
                    const crackTime = user.crack_report_time ? formatTime(user.crack_report_time) : '近期';
                    crackDisplay = `<span style="color: #ef4444; font-weight: bold;" title="捕获时间: ${crackTime}">🚨 异常 (白嫖党)</span>`;
                }

                const remarkDisplay = user.remark ? user.remark : `<span style="color:#64748b; font-style:italic;">[点击添加]</span>`;
                
                const codeRemarkDisplay = user.code_remark 
                    ? `<span style="color:#a78bfa; font-size:12px; background:#4c1d95; padding:2px 6px; border-radius:4px;">${user.code_remark}</span>` 
                    : `<span style="color:#64748b;">-</span>`;

                htmlString += `<tr>
                    <td style="font-weight: bold; color: #e2e8f0;">${displayUsername}</td>
                    <td>${displayPassword}</td>
                    <td class="${vipClass}">${vipType}</td>
                    <td>${priceDisplay}</td>
                    <td style="color: #10b981;">${user.used_code || '-'}</td>
                    <td>${codeRemarkDisplay}</td>
                    <td>${timeBox}</td>
                    <td>${firstActive}</td>
                    <td>${trafficLights}</td>
                    <td>${appVersion}</td>
                    <td>${deviceModel}</td>
                    <td>${activeDisplay}</td>
                    <td>${crackDisplay}</td>
                    <td>${actionBtn}</td>
                    <td class="uuid-text">${uuidDisplay}</td>
                    
                    <td style="text-align: center;">${markHtml}</td>
                    
                    <td class="remark-cell" onclick="editRemark(this)">
                        <div class="remark-text">${remarkDisplay}</div>
                        <input type="text" class="remark-input" style="display:none;" value="${user.remark || ''}" data-user="${safeUsername}" data-uuid="${safeUuid}" placeholder="回车保存，Esc取消" onkeydown="saveRemark(event, this)" onblur="cancelRemark(this)">
                    </td>
                </tr>`;
            });
            tbody.innerHTML = htmlString;
            document.getElementById('userCount').innerText = `共筛出 ${dataArray.length} 台设备`;
        }

        function filterTable() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const vipFilter = document.getElementById('vipFilter').value;

            const filteredData = allUserData.filter(user => {
                // 🌟 核心优化：将 used_code (使用的密钥) 加入搜索比对字符串
                const codeRemarkStr = user.code_remark ? user.code_remark.toLowerCase() : "";
                const usedCodeStr = user.used_code ? user.used_code.toLowerCase() : "";
                
                const searchStr = (user.username || "") + " " + (user.device_uuid || "") + " " + (user.remark || "") + " " + codeRemarkStr + " " + usedCodeStr;
                const matchKeyword = searchStr.toLowerCase().includes(keyword);
                
                const userType = getUserVipType(user);
                
                let matchVip = false;
                if (vipFilter === '全部') {
                    matchVip = true;
                } else if (vipFilter === '排除未注册用户') {
                    matchVip = (userType !== '未注册用户'); 
                } else {
                    matchVip = (userType === vipFilter);
                }
                
                return matchKeyword && matchVip;
            });
            
            currentFilteredData = filteredData;
            renderTable(filteredData);
        }

        function exportToCSV() {
            if (currentFilteredData.length === 0) {
                alert("⚠️ 当前列表为空，没有可导出的数据！");
                return;
            }

            const headers = ['用户名', '密码', '身份状态', '售价(元)', '使用的密钥', '密钥备注', '注册时间', '核销时间', '首次安装时间', '7日活跃记录(打卡日期)', 'App版本', '车机型号/系统', '最后活跃时间', '查水表状态', '当前绑定设备(UUID)', '用户专属备注'];
            
            const escapeCSV = (str) => {
                if (str === null || str === undefined) return '""';
                const s = String(str);
                return '"' + s.replace(/"/g, '""') + '"'; 
            };

            const rows = currentFilteredData.map(user => {
                const username = user.username ? user.username : '(未注册设备)';
                const password = user.password ? user.password : '-';
                const vipType = getUserVipType(user);
                const price = (user.price !== null && user.price !== undefined) ? user.price : '-'; 
                const code = user.used_code ? user.used_code : '-';
                const codeRemarkStr = user.code_remark ? user.code_remark : '-';
                
                const regTimeStr = user.created_at ? formatTime(user.created_at) : '-';
                const actTimeStr = user.used_time ? formatTime(user.used_time) : '-';
                const firstActiveStr = user.first_active || '-';
                const recent7DaysStr = (user.recent_7_days || []).join(' | ') || '-';

                const appVersion = user.app_version ? user.app_version : '-';
                const deviceModel = user.device_model ? user.device_model : '-'; 
                const lastActive = user.last_active ? user.last_active : '无记录';
                const crackStatus = user.is_cracked ? '异常(疑似破解)' : '正常';
                const uuid = user.device_uuid ? user.device_uuid : '未绑定设备';
                const remarkStr = user.remark ? user.remark : '';
                
                return [username, password, vipType, price, code, codeRemarkStr, regTimeStr, actTimeStr, firstActiveStr, recent7DaysStr, appVersion, deviceModel, lastActive, crackStatus, uuid, remarkStr].map(escapeCSV).join(',');
            });

            const csvContent = "\uFEFF" + headers.map(escapeCSV).join(',') + "\n" + rows.join("\n");
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.setAttribute("href", url);
            const dateStr = new Date().toISOString().slice(0, 10);
            link.setAttribute("download", `用户明细全量报表_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function editRemark(td) {
            const span = td.querySelector('.remark-text');
            const input = td.querySelector('.remark-input');
            if (input.style.display === 'block') return; 
            span.style.display = 'none';
            input.style.display = 'block';
            input.focus();
        }

        function cancelRemark(input) {
            const td = input.parentElement;
            const span = td.querySelector('.remark-text');
            input.style.display = 'none';
            span.style.display = 'block';
            
            const originalVal = span.innerText === '[点击添加]' ? '' : span.innerText;
            input.value = originalVal;
        }

        function saveRemark(event, input) {
            if (event.key === 'Escape') {
                input.blur(); 
                return;
            }
            if (event.key === 'Enter') {
                event.preventDefault();
                const username = input.getAttribute('data-user');
                const uuid = input.getAttribute('data-uuid');
                const newRemark = input.value.trim();
                const td = input.parentElement;
                const span = td.querySelector('.remark-text');

                input.disabled = true; 

                fetch(`${SUPABASE_URL}/rest/v1/rpc/admin_update_remark`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_pwd: currentPwd, p_username: username, p_uuid: uuid, p_remark: newRemark })
                })
                .then(res => res.json())
                .then(resData => {
                    input.disabled = false;
                    if(resData.success) {
                        const target = allUserData.find(u => (u.username||'') === username && (u.device_uuid||'') === uuid);
                        if (target) target.remark = newRemark;
                        
                        if (newRemark) {
                            span.innerText = newRemark;
                            span.style.color = '#e2e8f0';
                            span.style.fontStyle = 'normal';
                        } else {
                            span.innerHTML = '<span style="color:#64748b; font-style:italic;">[点击添加]</span>';
                        }
                        input.style.display = 'none';
                        span.style.display = 'block';
                    } else {
                        alert('备注保存失败：' + (resData.msg || '未知错误'));
                        input.blur(); 
                    }
                })
                .catch(err => {
                    input.disabled = false;
                    alert('网络请求异常：' + err);
                    input.blur(); 
                });
            }
        }

		function forceUnbind(targetUsername) {
            if(!confirm(`⚠️ 危险操作确认\n\n确定要强制清空账号【${targetUsername}】的设备绑定吗？\n清空后他可以在新车机直接登录。`)) return;

            fetch(`${SUPABASE_URL}/rest/v1/rpc/admin_unbind_device`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                // 🌟 核心修正：这里改为 target_username，与刚才更新的 SQL 保持 100% 一致！
                body: JSON.stringify({ admin_pwd: currentPwd, target_username: targetUsername })
            })
            .then(async res => {
                const resData = await res.json();
                if(res.ok && resData.success) {
                    alert('✅ ' + resData.msg);
                    fetchData(); 
                } else {
                    // 🌟 防御 undefined 的铁甲
                    const errorInfo = resData.msg || resData.message || '未知服务器错误';
                    console.error("解绑原始报错:", resData);
                    alert('❌ 解绑失败：' + errorInfo);
                }
            })
            .catch(err => {
                console.error("网络请求异常:", err);
                alert('❌ 解绑失败：网络连接异常');
            });
        }

        function deleteUser(targetUsername, targetUuid) {
            let confirmMsg = '';
            if (targetUsername) {
                confirmMsg = `🚨 极度危险操作！\n\n确定要彻底删除账号【${targetUsername}】及该设备的所有记录吗？\n删除后卡密将被重置为【未激活】供二次使用！`;
            } else {
                confirmMsg = `🗑️ 确认清理？\n\n确定要彻底清除这台未注册设备【${targetUuid}】的全部打卡痕迹吗？\n清理后将从日活及装机报表中彻底移除。`;
            }

            if(!confirm(confirmMsg)) return;

            if (targetUsername) {
                if(!confirm(`⚠️ 最后一次警告！\n\n如果该用户仍在使用车机，只要不登出他依然是VIP。但如果他登出，将永远无法找回账号！\n\n确定继续删除？`)) return;
            }

            fetch(`${SUPABASE_URL}/rest/v1/rpc/admin_delete_trace`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_pwd: currentPwd, p_username: targetUsername, p_uuid: targetUuid })
            })
            .then(async res => {
                const resData = await res.json();
                if(res.ok && resData.success) {
                    alert('✅ ' + resData.msg);
                    fetchData(); 
                } else {
                    // 🌟 同样的防御铁甲，顺手帮 deleteUser 也堵上漏洞
                    const errorInfo = resData.msg || resData.message || '未知服务器错误';
                    console.error("删除原始报错:", resData);
                    alert('❌ 删除失败：' + errorInfo);
                }
            })
            .catch(err => {
                console.error("网络请求异常:", err);
                alert('❌ 删除失败：网络连接异常');
            });
        }
    </script>
