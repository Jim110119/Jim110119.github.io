<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悬浮歌词 - 运营数据大屏</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        body { margin: 0; padding: 20px; background-color: #0f172a; color: #38bdf8; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .dashboard { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: rgba(30, 41, 59, 0.7); padding: 30px; border-radius: 16px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.1); border: 1px solid #334155; text-align: center; }
        h2 { font-size: 20px; color: #e2e8f0; margin-top: 0; margin-bottom: 10px; letter-spacing: 1px; }
        .number-box { font-size: 60px; font-weight: bold; color: #0ea5e9; text-shadow: 0 0 15px rgba(14, 165, 233, 0.5); margin: 10px 0; }
        .loading { font-size: 30px; color: #94a3b8; animation: pulse 1.5s infinite; }
        .footer { margin-top: 20px; font-size: 13px; color: #64748b; text-align: center; }
        .chart-container { position: relative; height: 300px; width: 100%; margin-top: 20px; }
        
        /* 独立控制按钮组样式，适配移动端 */
        .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 25px; flex-wrap: wrap; }
        .action-btn { text-decoration: none; font-weight: bold; padding: 10px 20px; border-radius: 8px; font-size: 14px; transition: all 0.3s; }
        .action-btn:hover { opacity: 0.8; transform: translateY(-2px); }
        .btn-admin { color: #f59e0b; border: 1px solid #f59e0b; }
        .btn-codes { color: #10b981; border: 1px solid #10b981; }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* --- 新增：自定义结构图图例样式 --- */
        .custom-legend-container {
            display: flex;
            justify-content: center; /* 核心：让内部的块整体居中 */
            margin-top: 15px;
            width: 100%;
        }
        .custom-legend-box {
            display: inline-flex;
            flex-direction: column; /* 竖向排列 */
            align-items: flex-start; /* 核心：内部元素严格左对齐（颜色块对齐） */
        }
        .legend-item {
            display: flex;
            align-items: center;
            color: #e2e8f0;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .legend-color-box {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            margin-right: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="dashboard">
		
        <div style="display: flex; gap: 20px; flex-wrap: wrap; width: 100%;">
            <div class="card" style="flex: 1; min-width: 250px;">
                <h2>🚀 累计总装机</h2>
                <div id="installCount" class="number-box loading">...</div>
            </div>
    
            <div class="card" style="flex: 1; min-width: 250px;">
                <h2>🔥 今日实时活跃</h2>
                <div id="todayActiveCount" class="number-box loading">...</div>
            </div>
            <div class="card" style="flex: 1; min-width: 250px;">
                <h2>🗑️ 沉睡废弃空号</h2>
                <div id="abandonedCount" class="number-box loading" style="color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.5);">...</div>
                <div style="font-size: 12px; color: #94a3b8; margin-top: -10px;">(大于7天未活跃的未付费号)</div>
            </div>
        </div>

        <div class="card">
            <h2>📈 最近 7 天活跃趋势 (DAU)</h2>
            <div class="chart-container">
                <canvas id="dauChart"></canvas>
            </div>
        </div>
		
		<div class="card">
            <h2>💎 注册与付费转化结构图</h2>
            
            <div class="chart-container" style="height: 80px; margin-top: 10px;"> 
                <canvas id="vipChart"></canvas>
            </div>
            
            <div class="custom-legend-container">
                <div class="custom-legend-box">
                    <div class="legend-item"><span class="legend-color-box" style="background-color: #f59e0b;"></span>💰 真金白银购买VIP</div>
                    <div class="legend-item"><span class="legend-color-box" style="background-color: #8b5cf6;"></span>🎁 免费赠送福利VIP</div>
                    <div class="legend-item"><span class="legend-color-box" style="background-color: #475569;"></span>⚪ 普通未付费号</div>
                </div>
            </div>
            
            <div class="btn-group">
                <a href="admin_details.html" target="_blank" class="action-btn btn-admin">👉 高级管理员后台</a>
                <a href="admin_codes.html" target="_blank" class="action-btn btn-codes">📦 密钥发货控制台</a>
            </div>
        </div>
        
        <div class="footer">数据每分钟自动刷新 | 数据来源：Supabase 端云同步架构</div>
    </div>

    <script>
        // 注册 Datalabels 插件
        Chart.register(ChartDataLabels);
        const SUPABASE_URL = 'https://clefvejumahurbbzdwbe.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsZWZ2ZWp1bWFodXJiYnpkd2JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMzE0MzIsImV4cCI6MjA4ODYwNzQzMn0.KB_WSUNRfmZ7Kvps8Gpvr1EESmX25d3t7TeZrP4kdEo';
        const headers = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' };

        fetch(`${SUPABASE_URL}/rest/v1/installations?select=id&limit=1`, { method: 'GET', headers: { ...headers, 'Range-Unit': 'items', 'Prefer': 'count=exact' } })
            .then(res => animateValue("installCount", 0, res.headers.get('Content-Range') ? parseInt(res.headers.get('Content-Range').split('/')[1]) : 0, 1500));

        fetch(`${SUPABASE_URL}/rest/v1/daily_stats?select=*`, { method: 'GET', headers: headers }).then(res => res.json()).then(data => {
            data.reverse();
            const labels = data.map(item => item.active_date.substring(5));
            const counts = data.map(item => item.active_count);
            animateValue("todayActiveCount", 0, counts.length > 0 ? counts[counts.length - 1] : 0, 1500);

            new Chart(document.getElementById('dauChart').getContext('2d'), {
                type: 'line',
                data: { labels: labels, datasets: [{ label: '日活跃车机数', data: counts, borderColor: '#0ea5e9', backgroundColor: 'rgba(14, 165, 233, 0.2)', borderWidth: 3, pointBackgroundColor: '#fff', pointRadius: 5, fill: true, tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: '#334155' }, ticks: { color: '#94a3b8', stepSize: 1 } }, x: { grid: { display: false }, ticks: { color: '#94a3b8' } } }, plugins: { legend: { display: false }, datalabels: { display: false } /* 隐藏折线图的数字标签 */ } }
            });
        });

		// 🌟 核心重写：获取用户结构，并绘制百分比堆叠漏斗图
        fetch(`${SUPABASE_URL}/rest/v1/rpc/get_user_stats`, { method: 'POST', headers: headers }).then(res => res.json()).then(data => {
            const total = data.total || 0;
            const purchasedVip = data.purchased_vip || 0;
            const giftedVip = data.gifted_vip || 0;
            const free = total - purchasedVip - giftedVip;

            new Chart(document.getElementById('vipChart').getContext('2d'), {
                type: 'bar', 
                data: {
                    labels: ['用户商业价值层级'],
                    datasets: [
                        { label: '💰 真金白银购买VIP', data: [purchasedVip], backgroundColor: '#f59e0b', stack: 'Stack 0' }, // 橙金
                        { label: '🎁 免费赠送福利VIP', data: [giftedVip], backgroundColor: '#8b5cf6', stack: 'Stack 0' },    // 紫色
                        { label: '⚪ 普通未付费号', data: [free], backgroundColor: '#475569', stack: 'Stack 0' }      // 灰色
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    // 改为横向显示，更像漏斗切面
                    indexAxis: 'y', 
                    scales: {
                        x: { stacked: true, display: false }, // 隐藏底部的数量轴，保持干净
                        y: { stacked: true, display: false } // 隐藏左侧文字和留白，绝对居中
                    },
                    plugins: {
                        legend: { display: false }, // 彻底关闭自带图例
                        tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', titleFont: { size: 14 }, bodyFont: { size: 14 }, padding: 12 },
                        // 🌟 Datalabels 插件配置：在每一块色块上显示数字和百分比
                        datalabels: {
                            color: '#ffffff',
                            font: { weight: 'bold', size: 14 },
                            formatter: (value, ctx) => {
                                if (value === 0) return ''; // 数量为0不显示文字
                                const percentage = total > 0 ? ((value / total) * 100).toFixed(1) + '%' : '0%';
                                // 返回两行文字：数量 和 (百分比)
                                return value + ' 人\n(' + percentage + ')';
                            },
                            textAlign: 'center',
                            // 文字居中显示在色块中间
                            anchor: 'center',
                            align: 'center',
                        }
                    }
                }
            });
        });

        fetch(`${SUPABASE_URL}/rest/v1/rpc/get_abandoned_users_count`, { method: 'POST', headers: headers }).then(res => res.json()).then(count => {
            animateValue("abandonedCount", 0, count || 0, 1500);
        }).catch(() => { document.getElementById("abandonedCount").innerHTML = "0"; document.getElementById("abandonedCount").classList.remove("loading"); });

        function animateValue(id, start, end, duration) {
            let obj = document.getElementById(id);
            obj.classList.remove("loading");
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }
    </script>
</body>
</html>
