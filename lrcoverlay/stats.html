<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>零听歌词 - 运营数据大屏</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; padding: 20px; background-color: #0f172a; color: #38bdf8; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .dashboard { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: rgba(30, 41, 59, 0.7); padding: 30px; border-radius: 16px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.1); border: 1px solid #334155; text-align: center; }
        h2 { font-size: 20px; color: #e2e8f0; margin-top: 0; margin-bottom: 10px; letter-spacing: 1px; }
        .number-box { font-size: 60px; font-weight: bold; color: #0ea5e9; text-shadow: 0 0 15px rgba(14, 165, 233, 0.5); margin: 10px 0; }
        .loading { font-size: 30px; color: #94a3b8; animation: pulse 1.5s infinite; }
        .footer { margin-top: 20px; font-size: 13px; color: #64748b; text-align: center; }
        .chart-container { position: relative; height: 300px; width: 100%; margin-top: 20px; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="dashboard">
<div style="display: flex; gap: 20px;">
            <div class="card" style="flex: 1;">
                <h2>🚀 累计总装机</h2>
                <div id="installCount" class="number-box loading">...</div>
            </div>
            <div class="card" style="flex: 1;">
                <h2>🔥 今日实时活跃</h2>
                <div id="todayActiveCount" class="number-box loading">...</div>
            </div>
            <div class="card" style="flex: 1;">
                <h2>🗑️ 沉睡废弃空号</h2>
                <div id="abandonedCount" class="number-box loading" style="color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.5);">...</div>
                <div style="font-size: 12px; color: #94a3b8; margin-top: -10px;">(大于7天未活跃的未付费号)</div>
            </div>
        </div>

        <div class="card">
            <h2>📈 最近 7 天活跃趋势 (DAU)</h2>
            <div class="chart-container">
                <canvas id="dauChart"></canvas>
            </div>
        </div>
		
		<div class="card">
            <h2>💎 注册与付费转化漏斗</h2>
            <div class="chart-container">
                <canvas id="vipChart"></canvas>
            </div>
            <div style="margin-top: 20px;">
                <a href="admin_details.html" target="_blank" style="color: #f59e0b; text-decoration: none; font-weight: bold; border: 1px solid #f59e0b; padding: 8px 15px; border-radius: 8px;">👉 进入高级管理员后台</a>
            </div>

            <div style="margin-top: 20px;">
                <a href="admin_codes.html" target="_blank" style="color: #10b981; text-decoration: none; font-weight: bold; border: 1px solid #10b981; padding: 8px 15px; border-radius: 8px; margin-left: 10px;">👉 进入密钥发货控制台</a>
            </div>
			
        </div>
        
        <div class="footer">数据每分钟自动刷新 | 数据来源：Supabase 端云同步架构</div>
    </div>

    <script>
        // ================= 替换为你的 Supabase 配置 =================
        const SUPABASE_URL = 'https://clefvejumahurbbzdwbe.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsZWZ2ZWp1bWFodXJiYnpkd2JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMzE0MzIsImV4cCI6MjA4ODYwNzQzMn0.KB_WSUNRfmZ7Kvps8Gpvr1EESmX25d3t7TeZrP4kdEo';
        
        const headers = {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json'
        };

        // 1. 获取总装机量 (逻辑不变)
        fetch(`${SUPABASE_URL}/rest/v1/installations?select=id&limit=1`, {
            method: 'GET',
            headers: { ...headers, 'Range-Unit': 'items', 'Prefer': 'count=exact' }
        }).then(res => {
            const range = res.headers.get('Content-Range');
            const total = range ? parseInt(range.split('/')[1]) : 0;
            animateValue("installCount", 0, total, 1500);
        });

        // 2. 获取 7 天活跃数据 (直接请求我们刚才写的 SQL 视图！)
        fetch(`${SUPABASE_URL}/rest/v1/daily_stats?select=*`, {
            method: 'GET',
            headers: headers
        }).then(res => res.json()).then(data => {
            // 数据库返回的是倒序（最新日期在前），我们要反转一下方便画图（从左到右显示）
            data.reverse();

            // 提取图表需要的 X 轴（日期）和 Y 轴（活跃人数）
            const labels = data.map(item => item.active_date.substring(5)); // 把 "2026-03-09" 变成 "03-09"
            const counts = data.map(item => item.active_count);

            // 更新今日实时活跃量（取数组最后一天的数据）
            const todayCount = counts.length > 0 ? counts[counts.length - 1] : 0;
            animateValue("todayActiveCount", 0, todayCount, 1500);

            // 3. 绘制帅气的折线图
            const ctx = document.getElementById('dauChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '日活跃车机数',
                        data: counts,
                        borderColor: '#0ea5e9',
                        backgroundColor: 'rgba(14, 165, 233, 0.2)',
                        borderWidth: 3,
                        pointBackgroundColor: '#fff',
                        pointRadius: 5,
                        fill: true,
                        tension: 0.3 // 让线条有平滑的弧度
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#334155' }, ticks: { color: '#94a3b8', stepSize: 1 } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', titleFont: { size: 14 }, bodyFont: { size: 14 }, padding: 12 }
                    }
                }
            });
        });

        function animateValue(id, start, end, duration) {
            let obj = document.getElementById(id);
            obj.classList.remove("loading");
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }
		
		// 4. 获取用户注册与VIP统计数据
        fetch(`${SUPABASE_URL}/rest/v1/rpc/get_user_stats`, {
            method: 'POST', // RPC 调用一律用 POST
            headers: headers
        }).then(res => res.json()).then(data => {
            const total = data.total || 0;
            const vip = data.vip || 0;
            const free = total - vip;

            const ctxVip = document.getElementById('vipChart').getContext('2d');
            new Chart(ctxVip, {
                type: 'bar', // 柱状图
                data: {
                    labels: ['用户账号结构'],
                    datasets: [
                        {
                            label: '已购 VIP',
                            data: [vip],
                            backgroundColor: '#f59e0b', // 金色
                            stack: 'Stack 0', // 堆叠标识
                        },
                        {
                            label: '未购买 (普通用户)',
                            data: [free],
                            backgroundColor: '#475569', // 灰色
                            stack: 'Stack 0',
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true, grid: { display: false }, ticks: { color: '#94a3b8' } },
                        y: { stacked: true, beginAtZero: true, grid: { color: '#334155' }, ticks: { color: '#94a3b8', stepSize: 1 } }
                    },
                    plugins: {
                        tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', titleFont: { size: 14 }, bodyFont: { size: 14 }, padding: 12 }
                    }
                }
            });
        });
		
		// 5. 获取废弃沉睡空号数量
        fetch(`${SUPABASE_URL}/rest/v1/rpc/get_abandoned_users_count`, {
            method: 'POST', // 调用 RPC 必须用 POST
            headers: headers
        }).then(res => res.json()).then(count => {
            // count 就是云端直接算好的一个整数
            animateValue("abandonedCount", 0, count || 0, 1500);
        }).catch(err => {
            document.getElementById("abandonedCount").innerHTML = "0";
            document.getElementById("abandonedCount").classList.remove("loading");
        });
		
    </script>
</body>
</html>
