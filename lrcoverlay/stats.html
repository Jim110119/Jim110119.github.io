<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悬浮歌词 - 运营数据大屏</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        body { margin: 0; padding: 20px; background-color: #0f172a; color: #38bdf8; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        
        /* 登录框样式 */
        .auth-box { text-align: center; margin-top: 15vh; width: 100%; }
        input.pwd-input { padding: 12px; border-radius: 8px; border: 1px solid #38bdf8; background: #1e293b; color: white; outline: none; width: 80%; max-width: 300px; font-size: 16px; margin-bottom: 15px; text-align: center; }
        button.btn-primary { padding: 12px 20px; border-radius: 8px; background: #0284c7; color: white; border: none; cursor: pointer; font-weight: bold; }
        
        /* 基础数据框 */
        .container { display: flex; justify-content: space-around; width: 100%; max-width: 1200px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 20px; width: 22%; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 15px; }
        .stat-box h3 { margin: 0 0 10px 0; font-size: 14px; color: #94a3b8; }
        .stat-value { font-size: 32px; font-weight: bold; color: #f8fafc; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }

        /* 💎 注册付费漏斗样式 (原有) */
        .conversion-funnel { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 1200px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        /* (这里省略了你原有的 .step 样式，如果你原来有，请保留，我这里用简化的展示) */

        /* ========================================================= */
        /* 🌟 新增：卡密细长结构图专属样式 */
        /* ========================================================= */
        .coupon-structure-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .coupon-structure-item {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .coupon-title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            width: 100%;
            text-align: center;
        }

        .coupon-funnel {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 60px; /* 细长高度 */
            width: 100%;
            margin-bottom: 10px;
        }

        .coupon-block {
            height: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
            text-align: center;
            padding: 5px;
        }

        .coupon-block::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            transform: skewX(-15deg); /* 斜切效果 */
            border-radius: 4px;
            z-index: 1;
        }

        .coupon-block span { position: relative; z-index: 2; }
        .coupon-label { font-size: 11px; color: rgba(255,255,255,0.8); }
        .coupon-num { font-size: 18px; font-weight: 800; }

        /* 4大专属渐变色 */
        .block-sold-t::after { background: linear-gradient(135deg, #166534 0%, #15803d 100%); }
        .block-sold-u::after { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        .block-gift-t::after { background: linear-gradient(135deg, #6b21a8 0%, #7e22ce 100%); }
        .block-gift-u::after { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); }
        .block-dist-total::after { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
        .block-dist-d::after { background: linear-gradient(135deg, #ea580c 0%, #f97316 100%); }
        .block-total-active::after { background: linear-gradient(135deg, #075985 0%, #0369a1 100%); }

        .coupon-arrow { color: rgba(56, 189, 248, 0.4); font-size: 16px; margin: 0 5px; position: relative; z-index: 3; }
        .loading { opacity: 0.5; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="auth-box" id="authBox">
        <h1 style="color: #f8fafc; margin-bottom: 30px;">🛡️ 悬浮歌词运营指挥中心</h1>
        <input type="password" id="adminPwd" class="pwd-input" placeholder="请输入超级管理员密码" onkeypress="if(event.keyCode===13) checkPwd()"><br>
        <button class="btn-primary" onclick="checkPwd()">进入系统</button>
    </div>

    <div id="dashboard" style="display: none; width: 100%; flex-direction: column; align-items: center;">
        
        <div class="container">
            <div class="stat-box"><h3>💎 总注册用户</h3><div class="stat-value loading" id="totalUsers">0</div></div>
            <div class="stat-box"><h3>🔥 今日活跃 (DAU)</h3><div class="stat-value loading" id="todayDau">0</div></div>
            <div class="stat-box"><h3>📱 独立设备总数</h3><div class="stat-value loading" id="uniqueDeviceCount">0</div></div>
            <div class="stat-box"><h3>💰 预估总流水</h3><div class="stat-value loading" id="totalRevenue">0</div></div>
        </div>

        <h3 style="width: 100%; max-width: 1200px; text-align: left; color: #e2e8f0;">💎 注册与付费转化结构图</h3>
        <div class="conversion-funnel loading" id="regFunnel">
             <div style="color: #94a3b8;">(原有注册付费转化漏斗)</div>
        </div>

        <h3 style="width: 100%; max-width: 1200px; text-align: left; margin-top: 25px; margin-bottom: 10px; color: #e2e8f0;">🎫 卡密流转与转化率</h3>
        <div class="coupon-structure-container">
            
            <div class="coupon-structure-item">
                <div class="coupon-title-row"><span>💰 出售转化 (激活/售出)</span></div>
                <div class="coupon-funnel loading" id="funnelSold">
                    <div class="coupon-block block-sold-t"><span class="coupon-label">售出(分母)</span><span class="coupon-num" id="cpSoldT">0</span></div>
                    <div class="coupon-arrow">➜</div>
                    <div class="coupon-block block-sold-u"><span class="coupon-label">激活(分子)</span><span class="coupon-num" id="cpSoldU">0</span></div>
                </div>
                <div style="font-size: 11px; color: #22c55e; font-weight: bold;" id="cpSoldRatio">转化率: 0%</div>
            </div>

            <div class="coupon-structure-item">
                <div class="coupon-title-row"><span>🎁 赠送转化 (激活/赠出)</span></div>
                <div class="coupon-funnel loading" id="funnelGift">
                    <div class="coupon-block block-gift-t"><span class="coupon-label">赠出(分母)</span><span class="coupon-num" id="cpGiftT">0</span></div>
                    <div class="coupon-arrow">➜</div>
                    <div class="coupon-block block-gift-u"><span class="coupon-label">激活(分子)</span><span class="coupon-num" id="cpGiftU">0</span></div>
                </div>
                <div style="font-size: 11px; color: #ec4899; font-weight: bold;" id="cpGiftRatio">转化率: 0%</div>
            </div>

            <div class="coupon-structure-item">
                <div class="coupon-title-row"><span>📦 派发进度 (已派发/总盘)</span></div>
                <div class="coupon-funnel loading" id="funnelDist">
                    <div class="coupon-block block-dist-total"><span class="coupon-label">总库存(分母)</span><span class="coupon-num" id="cpTotalAll1">0</span></div>
                    <div class="coupon-arrow">➜</div>
                    <div class="coupon-block block-dist-d"><span class="coupon-label">派发(S+G)</span><span class="coupon-num" id="cpDistT">0</span></div>
                </div>
                <div style="font-size: 11px; color: #f97316; font-weight: bold;" id="cpDistRatio">总占有率: 0%</div>
            </div>

            <div class="coupon-structure-item">
                <div class="coupon-title-row"><span>⭐ 总盘激活 (已激活/总盘)</span></div>
                <div class="coupon-funnel loading" id="funnelTotalActive">
                    <div class="coupon-block block-dist-total"><span class="coupon-label">总库存(分母)</span><span class="coupon-num" id="cpTotalAll2">0</span></div>
                    <div class="coupon-arrow">➜</div>
                    <div class="coupon-block block-total-active"><span class="coupon-label">激活(总)</span><span class="coupon-num" id="cpTotalActiveU">0</span></div>
                </div>
                <div style="font-size: 11px; color: #38bdf8; font-weight: bold;" id="cpTotalActiveRatio">全局激活率: 0%</div>
            </div>

        </div>

        </div>

    <script>
        // ⚠️ 记得填入你的真实参数！
        const SUPABASE_URL = "https://clefvejumahurbbzdwbe.supabase.co"; 
        const ANON_KEY = "eyJhbG... (填入你原本的前端公钥)";
        
        let headers = {
            "apikey": ANON_KEY,
            "Authorization": `Bearer ${ANON_KEY}`,
            "Content-Type": "application/json"
        };

        function checkPwd() {
            // 填入你的大屏查看密码
            if(document.getElementById("adminPwd").value === "Ljm199447!") {
                document.getElementById("authBox").style.display = "none";
                document.getElementById("dashboard").style.display = "flex";
                loadDashboardData();
            } else {
                alert("密码错误！");
            }
        }

        function loadDashboardData() {
            // ... (此处保留你原有的获取总注册、日活、收入等数据的 fetch 代码) ...

            // =================================================================
            // 🌟 核心新增：请求后台统计卡密数据，并渲染到全新的结构图中
            // =================================================================
            fetch(`${SUPABASE_URL}/rest/v1/rpc/get_code_stats`, { method: 'POST', headers: headers })
                .then(res => res.json())
                .then(data => {
                    const soldTotal = data.sold_total || 0;
                    const soldUsed = data.sold_used || 0;
                    const giftTotal = data.gift_total || 0;
                    const giftUsed = data.gift_used || 0;
                    const totalAll = data.total || 0;
                    
                    // 派发逻辑计算
                    const distributedTotal = soldTotal + giftTotal; 
                    const distributedUsed = soldUsed + giftUsed;   

                    // 转化率计算
                    const calculateRatio = (n, d) => d === 0 ? 0 : Math.round((n / d) * 100);
                    const ratioSold = calculateRatio(soldUsed, soldTotal);
                    const ratioGift = calculateRatio(giftUsed, giftTotal);
                    const ratioDist = calculateRatio(distributedTotal, totalAll);
                    const ratioTotalActive = calculateRatio(distributedUsed, totalAll);

                    // 渲染数字到界面
                    document.getElementById("cpSoldT").innerText = soldTotal;
                    document.getElementById("cpSoldU").innerText = soldUsed;
                    document.getElementById("cpSoldRatio").innerText = `出售转化率: ${ratioSold}%`;

                    document.getElementById("cpGiftT").innerText = giftTotal;
                    document.getElementById("cpGiftU").innerText = giftUsed;
                    document.getElementById("cpGiftRatio").innerText = `赠送转化率: ${ratioGift}%`;

                    document.getElementById("cpTotalAll1").innerText = totalAll;
                    document.getElementById("cpDistT").innerText = distributedTotal;
                    document.getElementById("cpDistRatio").innerText = `总占有率 (已派发): ${ratioDist}%`;

                    document.getElementById("cpTotalAll2").innerText = totalAll;
                    document.getElementById("cpTotalActiveU").innerText = distributedUsed;
                    document.getElementById("cpTotalActiveRatio").innerText = `全局激活率 (激活/总盘): ${ratioTotalActive}%`;

                    // 移除所有的加载闪烁动画
                    ["funnelSold", "funnelGift", "funnelDist", "funnelTotalActive"].forEach(id => {
                        const el = document.getElementById(id);
                        if(el) el.classList.remove("loading");
                    });
                })
                .catch(err => {
                    console.error("卡密数据加载失败", err);
                });
        }

        // 附带你原本的数字滚动动画器
        function animateValue(id, start, end, duration) {
            let obj = document.getElementById(id);
            if(!obj) return;
            obj.classList.remove("loading");
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }
    </script>
</body>
</html>
