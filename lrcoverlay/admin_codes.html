<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡密发货控制台</title>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: monospace; padding: 15px; margin: 0; padding-bottom: 80px; }
        .auth-box { text-align: center; margin-top: 50px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #38bdf8; background: #1e293b; color: white; width: 80%; max-width: 300px; font-size: 16px; margin-bottom: 15px; outline: none; }
        button.btn-primary { padding: 12px 20px; border-radius: 8px; border: none; background: #0ea5e9; color: white; cursor: pointer; font-weight: bold; font-size: 16px; width: 80%; max-width: 300px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .code-text { font-size: 18px; font-weight: bold; color: #38bdf8; margin-bottom: 8px; letter-spacing: 1px; }
        .info-text { font-size: 12px; color: #94a3b8; }
        .btn-copy { background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 8px; width: 100%; }
        select { background: #0f172a; color: white; border: 1px solid #475569; padding: 8px; border-radius: 6px; outline: none; width: 100%; font-size: 14px; }
        .status-sold { border-left: 4px solid #f59e0b; opacity: 0.6; }
        .status-ready { border-left: 4px solid #10b981; }
        
        /* 分页控制台样式 */
        .pagination { display: none; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px 15px; border-radius: 10px; border: 1px solid #334155; margin-bottom: 15px; position: sticky; top: 10px; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); }
        .page-btn { background: #334155; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-info { color: #38bdf8; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="auth-box" id="authBox">
        <h2>🔑 发货控制台</h2>
        <input type="password" id="adminPwd" placeholder="请输入管理员密码">
        <button class="btn-primary" onclick="fetchCodes()">解锁卡密库</button>
        <p id="errMsg" style="color: #ef4444; display: none; margin-top: 15px;">密码错误！</p>
    </div>

    <div class="pagination" id="paginationTop">
        <button class="page-btn" id="prevBtn" onclick="changePage(-1)">上一页</button>
        <div class="page-info" id="pageInfo">1 / 1</div>
        <button class="page-btn" id="nextBtn" onclick="changePage(1)">下一页</button>
    </div>

    <div id="codesContainer" style="display: none;">
        </div>

    <script>
        const SUPABASE_URL = 'https://clefvejumahurbbzdwbe.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsZWZ2ZWp1bWFodXJiYnpkd2JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMzE0MzIsImV4cCI6MjA4ODYwNzQzMn0.KB_WSUNRfmZ7Kvps8Gpvr1EESmX25d3t7TeZrP4kdEo';
        let currentPwd = '';
        
        // 分页核心变量
        let allCodesData = [];   // 把云端数据存在手机内存里
        let currentPage = 1;     // 当前页码
        const pageSize = 200;    // 每页显示 200 条

        function fetchCodes() {
            currentPwd = document.getElementById('adminPwd').value;
            const btn = document.querySelector('.btn-primary');
            btn.innerText = "加载中,请稍候..."; 
            btn.disabled = true;

            fetch(`${SUPABASE_URL}/rest/v1/rpc/get_admin_codes`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_pwd: currentPwd })
            })
            .then(res => res.json())
            .then(resData => {
                btn.innerText = "解锁卡密库";
                btn.disabled = false;

                if (resData.message) {
                    alert("数据库报错: " + resData.message);
                    return;
                }

                if (resData.success) {
                    document.getElementById('authBox').style.display = 'none';
                    document.getElementById('paginationTop').style.display = 'flex';
                    
                    // 把所有数据存入全局变量
                    allCodesData = resData.data; 
                    currentPage = 1; // 每次重新拉取回到第一页
                    
                    renderPage(); // 渲染当前页
                } else {
                    document.getElementById('errMsg').style.display = 'block';
                }
            })
            .catch(err => {
                btn.innerText = "解锁卡密库";
                btn.disabled = false;
                alert("请求失败: " + err);
            });
        }

        // 🌟 核心：只渲染当前页的 200 条数据
        function renderPage() {
            const container = document.getElementById('codesContainer');
            container.style.display = 'block';
            
            // 计算总页数和当前截取范围
            const totalPages = Math.ceil(allCodesData.length / pageSize) || 1;
            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = Math.min(startIndex + pageSize, allCodesData.length);
            
            // 切割出当前页需要显示的数据 (比如 0~200)
            const currentPageData = allCodesData.slice(startIndex, endIndex);

            // 更新顶部控制台的数字和按钮状态
            document.getElementById('pageInfo').innerText = `第 ${currentPage} / ${totalPages} 页 (共${allCodesData.length}条)`;
            document.getElementById('prevBtn').disabled = (currentPage === 1);
            document.getElementById('nextBtn').disabled = (currentPage === totalPages);

            // 拼装 HTML
            let htmlString = '';
            currentPageData.forEach(item => {
                const cardClass = item.sell_status === '已出售' ? 'status-sold' : 'status-ready';
                const isActivatedText = item.is_used ? `<span style="color:#ef4444;">已激活 (${item.used_by_user})</span>` : '未激活';
                
                htmlString += `
                    <div class="card ${cardClass}">
                        <div style="flex: 2;">
                            <div class="code-text">${item.code}</div>
                            <div class="info-text">状态: ${isActivatedText}</div>
                        </div>
                        <div style="flex: 1; text-align: right;">
                            <button class="btn-copy" onclick="copyCode('${item.code}', this)">一键复制</button>
                            <select onchange="updateStatus('${item.code}', this.value)">
                                <option value="待出售" ${item.sell_status === '待出售' ? 'selected' : ''}>🟢 待出售</option>
                                <option value="已出售" ${item.sell_status === '已出售' ? 'selected' : ''}>🟠 已出售</option>
                            </select>
                        </div>
                    </div>
                `;
            });
            
            // 一次性渲染
            container.innerHTML = htmlString;
        }

        // 🌟 核心：翻页动作
        function changePage(delta) {
            const totalPages = Math.ceil(allCodesData.length / pageSize);
            currentPage += delta;
            
            // 防止越界
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            
            renderPage();
            
            // 翻页后，自动平滑滚动回顶部，体验拉满！
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function copyCode(code, btnElement) {
            navigator.clipboard.writeText(code).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = '✅ 已复制!';
                btnElement.style.background = '#3b82f6';
                setTimeout(() => {
                    btnElement.innerText = '一键复制';
                    btnElement.style.background = '#10b981';
                }, 2000);
            }).catch(err => {
                alert('复制失败，请手动复制');
            });
        }

        function updateStatus(code, newStatus) {
            fetch(`${SUPABASE_URL}/rest/v1/rpc/update_code_status`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_pwd: currentPwd, p_code: code, p_status: newStatus })
            })
            .then(res => res.json())
            .then(resData => {
                if(resData.success) {
                    // 修改成功后，重新拉取云端数据刷新大盘
                    fetchCodes(); 
                } else {
                    alert('状态更新失败：' + resData.msg);
                }
            });
        }
    </script>
</body>
</html>
