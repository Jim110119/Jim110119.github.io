<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡密发货控制台</title>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: monospace; padding: 15px; margin: 0; }
        .auth-box { text-align: center; margin-top: 50px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #38bdf8; background: #1e293b; color: white; width: 80%; max-width: 300px; font-size: 16px; margin-bottom: 15px; outline: none; }
        button.btn-primary { padding: 12px 20px; border-radius: 8px; border: none; background: #0ea5e9; color: white; cursor: pointer; font-weight: bold; font-size: 16px; width: 80%; max-width: 300px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .code-text { font-size: 18px; font-weight: bold; color: #38bdf8; margin-bottom: 8px; letter-spacing: 1px; }
        .info-text { font-size: 12px; color: #94a3b8; }
        .btn-copy { background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 8px; width: 100%; }
        select { background: #0f172a; color: white; border: 1px solid #475569; padding: 8px; border-radius: 6px; outline: none; width: 100%; font-size: 14px; }
        .status-sold { border-left: 4px solid #f59e0b; opacity: 0.6; } /* 已出售卡片变暗加黄边 */
        .status-ready { border-left: 4px solid #10b981; } /* 待出售绿边 */
    </style>
</head>
<body>

    <div class="auth-box" id="authBox">
        <h2>🔑 发货控制台</h2>
        <input type="password" id="adminPwd" placeholder="请输入管理员密码">
        <button class="btn-primary" onclick="fetchCodes()">解锁卡密库</button>
        <p id="errMsg" style="color: #ef4444; display: none; margin-top: 15px;">密码错误！</p>
    </div>

    <div id="codesContainer" style="display: none; margin-top: 10px;">
        </div>

    <script>
        const SUPABASE_URL = 'https://clefvejumahurbbzdwbe.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsZWZ2ZWp1bWFodXJiYnpkd2JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMzE0MzIsImV4cCI6MjA4ODYwNzQzMn0.KB_WSUNRfmZ7Kvps8Gpvr1EESmX25d3t7TeZrP4kdEo';
        let currentPwd = '';

        function fetchCodes() {
            currentPwd = document.getElementById('adminPwd').value;
            const btn = document.querySelector('.btn-primary');
            
            // 1. 加上加载提示，防止用户连点
            btn.innerText = "加载中,请稍候..."; 
            btn.disabled = true;

            fetch(`${SUPABASE_URL}/rest/v1/rpc/get_admin_codes`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_pwd: currentPwd })
            })
            .then(res => res.json())
            .then(resData => {
                // 恢复按钮状态
                btn.innerText = "解锁卡密库";
                btn.disabled = false;

                // 🌟 拦截：如果你忘了在 Supabase 跑新增字段的 SQL，这里会精准报错提醒
                if (resData.message) {
                    alert("数据库报错: " + resData.message + "\n可能是第一步增加 sell_status 字段的 SQL 忘了执行？");
                    return;
                }

                if (resData.success) {
                    document.getElementById('authBox').style.display = 'none';
                    const container = document.getElementById('codesContainer');
                    container.style.display = 'block';
                    
                    // 🌟 核心修复：在内存里先拼接所有的 HTML 字符串
                    let htmlString = `<h3 style="text-align:center;">总库存：${resData.data.length} 条</h3>`;
                    
                    resData.data.forEach(item => {
                        const cardClass = item.sell_status === '已出售' ? 'status-sold' : 'status-ready';
                        const isActivatedText = item.is_used ? `<span style="color:#ef4444;">已激活 (${item.used_by_user})</span>` : '未激活';
                        
                        // 用 += 拼接到字符串里，而不是直接操作 DOM
                        htmlString += `
                            <div class="card ${cardClass}">
                                <div style="flex: 2;">
                                    <div class="code-text">${item.code}</div>
                                    <div class="info-text">车机状态: ${isActivatedText}</div>
                                </div>
                                <div style="flex: 1; text-align: right;">
                                    <button class="btn-copy" onclick="copyCode('${item.code}', this)">一键复制</button>
                                    <select onchange="updateStatus('${item.code}', this.value)">
                                        <option value="待出售" ${item.sell_status === '待出售' ? 'selected' : ''}>🟢 待出售</option>
                                        <option value="已出售" ${item.sell_status === '已出售' ? 'selected' : ''}>🟠 已出售</option>
                                    </select>
                                </div>
                            </div>
                        `;
                    });
                    
                    // 🌟 致命性能杀招：把拼好的 1000 个卡片，一次性塞入网页！秒开！
                    container.innerHTML = htmlString;
                    
                } else {
                    document.getElementById('errMsg').style.display = 'block';
                }
            })
            .catch(err => {
                btn.innerText = "解锁卡密库";
                btn.disabled = false;
                alert("网络请求失败，请检查网络或配置：" + err);
            });
        }

        // 核心功能：一键复制到手机剪贴板
        function copyCode(code, btnElement) {
            navigator.clipboard.writeText(code).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = '✅ 已复制!';
                btnElement.style.background = '#3b82f6';
                setTimeout(() => {
                    btnElement.innerText = '一键复制';
                    btnElement.style.background = '#10b981';
                }, 2000);
            }).catch(err => {
                alert('复制失败，请手动长按复制');
            });
        }

        // 核心功能：下拉框改变状态，实时同步云端
        function updateStatus(code, newStatus) {
            fetch(`${SUPABASE_URL}/rest/v1/rpc/update_code_status`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_pwd: currentPwd, p_code: code, p_status: newStatus })
            })
            .then(res => res.json())
            .then(resData => {
                if(resData.success) {
                    // 如果手滑点错了可以随时改回来，重新拉取一下最新列表刷新UI
                    fetchCodes(); 
                } else {
                    alert('状态更新失败：' + resData.msg);
                }
            });
        }
    </script>
</body>
</html>
